# Pages CMS configuration for the GDECOM website.
# Only editorial content is exposed. Institutional data (content/site.json), page SEO, the Privacy Policy, the 404 page,
# templates, CSS, JavaScript, build and QA files are intentionally NOT editable here.
# Generated by tools/migration/pages-config.js; maintained by the site administrator.
settings:
  content:
    merge: true
media:
  input: media
  output: /media
  extensions:
    - jpg
    - jpeg
    - png
    - webp
