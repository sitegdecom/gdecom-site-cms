  - name: artigos
    label: Artigos
    type: collection
    path: content/artigos
    format: yaml-frontmatter
    description: Artigos do site. Para criar um novo, clique em "Adicionar". O endereço da página é definido na criação e não deve ser alterado depois.
    filename:
      template: '{primary}.md'
      field: create
    view:
      primary: titulo
      fields:
        - titulo
        - chamada
    fields:
      - name: titulo
        label: Título do artigo
        type: string
        required: true
      - name: chamada
        label: Chamada acima do título
        type: string
        required: true
        description: Texto curto acima do título, por exemplo "Projetos e impacto social".
      - name: destaque
        label: Frase de destaque
        type: text
        required: true
        description: Aparece abaixo do título e é usada como resumo no Google quando a descrição abaixo fica em branco.
      - name: imagem
        label: Imagem principal
        type: object
        fields:
          - name: imagem
            label: Imagem
            type: image
            required: true
            description: JPG, PNG ou WebP, até 12 MB. As versões otimizadas são geradas automaticamente.
            options:
              extensions:
                - jpg
                - jpeg
                - png
                - webp
          - name: texto_alternativo
            label: Texto alternativo (descrição da imagem)
            type: string
            required: true
            description: Descreva o que aparece na imagem para quem usa leitor de tela. Obrigatório.
      - name: body
        label: Texto do artigo
        type: rich-text
        required: true
        options:
          format: html
        description: Use "Título 2" e "Título 3" para os subtítulos.
      - name: seo
        label: Busca e compartilhamento (opcional)
        type: object
        description: 'Pode deixar em branco: o site usa o título e a frase de destaque automaticamente.'
        fields:
          - name: titulo
            label: Título da aba e do Google
            type: string
            required: false
          - name: descricao
            label: Descrição para o Google e redes sociais
            type: text
            required: false
          - name: titulo_social
            label: Título ao compartilhar (redes sociais)
            type: string
            required: false
