# Pages CMS configuration for the GDECOM website.
# Only editorial content is exposed. Templates, CSS, JavaScript, build, QA files and the Privacy Policy are intentionally NOT listed here.
# Generated by tools/migration/pages-config.js during the CMS migration; maintained by the site administrator afterwards.
media:
  input: media
  output: /media
  extensions:
    - jpg
    - jpeg
    - png
    - webp
