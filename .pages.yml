      - name: endereco
        label: Endereço
        type: object
        fields:
          - name: logradouro
            label: Rua e número
            type: string
            required: true
          - name: bairro
            label: Bairro
            type: string
            required: true
          - name: cidade
            label: Cidade
            type: string
            required: true
          - name: uf
            label: UF
            type: string
            required: true
            pattern:
              regex: ^[A-Z]{2}$
              message: 'Duas letras maiúsculas, ex.: MG'
          - name: cep
            label: CEP
            type: string
            required: true
            pattern:
              regex: ^\d{5}-\d{3}$
              message: 'Formato: 00000-000'
      - name: telefone
        label: Telefone
        type: string
        required: true
        description: 'Formato exibido no site, ex.: (31) 3497-7255. O link de ligação é gerado automaticamente.'
      - name: email
        label: E-mail público
        type: string
        required: true
        pattern:
          regex: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          message: E-mail inválido
      - name: instagram
        label: Instagram (como aparece no site)
        type: string
        required: true
        description: 'Ex.: @gdecom'
      - name: instagram_url
        label: Instagram (endereço completo)
        type: string
        required: true
        pattern:
          regex: ^https://(www\.)?instagram\.com/
          message: 'Ex.: https://www.instagram.com/gdecom/'
      - name: rodape_texto
        label: Texto do rodapé
        type: string
        required: true
        description: Aparece no rodapé de todas as páginas, antes do CNPJ.
