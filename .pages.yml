            required: true
            description: 'Aparece na aba do navegador e nos resultados de busca. Ideal: até 60 caracteres.'
          - name: descricao
            label: Descrição para o Google e redes sociais
            type: text
            required: true
            description: 'Resumo da página usado pelo Google e no compartilhamento. Ideal: até 160 caracteres.'
          - name: titulo_social
            label: Título ao compartilhar (redes sociais)
            type: string
            required: true
        hidden: true
      - name: hero
        label: Topo (mensagem principal)
